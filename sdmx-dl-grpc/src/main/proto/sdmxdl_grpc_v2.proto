syntax = "proto3";
option java_multiple_files = true;

package sdmxdl.grpc.v2;

import "sdmxdl_api.proto";
import "sdmxdl_web.proto";

service SdmxWebManager {

  rpc GetAbout(EmptyDto) returns (sdmxdl.format.protobuf.AboutDto);

  rpc ListSources(WebSourcesRequestDto) returns (stream sdmxdl.format.protobuf.web.WebSourceDto);

  rpc ListDatabases(WebDatabasesRequestDto) returns (stream sdmxdl.format.protobuf.DatabaseDto);

  rpc ListFlows(WebFlowsRequestDto) returns (stream sdmxdl.format.protobuf.FlowDto);

  rpc GetMeta(WebMetaRequestDto) returns (sdmxdl.format.protobuf.MetaSetDto);

  rpc ListDimensions(WebDimensionsRequestDto) returns (stream sdmxdl.format.protobuf.DimensionDto);

  rpc ListAttributes(WebAttributesRequestDto) returns (stream sdmxdl.format.protobuf.AttributeDto);

  rpc GetData(WebDataRequestDto) returns (sdmxdl.format.protobuf.DataSetDto);

  rpc GetDataStream(WebDataRequestDto) returns (stream sdmxdl.format.protobuf.SeriesDto);

  rpc ListCodes(WebCodesRequestDto) returns (sdmxdl.format.protobuf.CodelistDto);

  rpc ListAvailability(WebAvailabilityRequestDto) returns (sdmxdl.format.protobuf.AvailabilityDto);

  rpc ListStatuses(WebStatusesRequestDto) returns (stream sdmxdl.format.protobuf.web.MonitorReportDto);

  rpc ListScriptTargets(EmptyDto) returns (stream ScriptTargetDto);

  rpc GenerateDataScript(WebDataScriptRequestDto) returns (ScriptDto);

  rpc GenerateFlowsScript(WebFlowsScriptRequestDto) returns (ScriptDto);
}

message EmptyDto {
}

// Field order convention: what is addressed (source, flow, key, ...), then filters, then context (database, languages).

message WebSourcesRequestDto {
  optional string query = 1;
  optional int32 max_results = 2; /* absent = all without query, 10 with query; 0 = no limit */
  optional sdmxdl.format.protobuf.ConfidentialityDto max_confidentiality = 3; /* absent = every source */
  optional string languages = 4;
}

message WebDatabasesRequestDto {
  string source = 1;
  optional string query = 2;
  optional int32 max_results = 3; /* absent = all without query, 10 with query; 0 = no limit */
  optional string languages = 4;
}

message WebFlowsRequestDto {
  string source = 1;
  optional string query = 2;
  optional int32 max_results = 3; /* absent = all without query, 10 with query; 0 = no limit */
  optional string database = 4;
  optional string languages = 5;
  optional bool plain_text = 6; /* strip markup (e.g. HTML tags) from descriptions; absent = false */
  optional int32 truncate = 7; /* maximum length of descriptions, truncated with an ellipsis; absent or 0 = no limit */
}

message WebMetaRequestDto {
  string source = 1;
  string flow = 2;
  optional string database = 3;
  optional string languages = 4;
}

message WebDimensionsRequestDto {
  string source = 1;
  string flow = 2;
  optional string query = 3;
  optional int32 max_results = 4; /* absent = all without query, 10 with query; 0 = no limit */
  optional string database = 5;
  optional string languages = 6;
}

message WebAttributesRequestDto {
  string source = 1;
  string flow = 2;
  optional string query = 3;
  optional int32 max_results = 4; /* absent = all without query, 10 with query; 0 = no limit */
  optional string database = 5;
  optional string languages = 6;
}

message WebDataRequestDto {
  string source = 1;
  string flow = 2;
  string key = 3;
  optional string start = 4; /* inclusive lower bound on the period, ISO-8601 reduced-precision date-time; absent = unbounded */
  optional string end = 5; /* inclusive upper bound on the period, ISO-8601 reduced-precision date-time; absent = unbounded */
  optional int32 first_n = 6; /* keep only the N first observations of each series; absent = no limit */
  optional int32 last_n = 7; /* keep only the N last observations of each series; absent = no limit */
  optional sdmxdl.format.protobuf.DetailDto detail = 8;
  optional string database = 9;
  optional string languages = 10;
}

message WebCodesRequestDto {
  string source = 1;
  string flow = 2;
  string concept = 3; /* dimension or attribute id, as returned by ListDimensions/ListAttributes */
  optional string query = 4;
  optional int32 max_results = 5; /* absent = all without query, 10 with query; 0 = no limit */
  optional string database = 6;
  optional string languages = 7;
}

message WebAvailabilityRequestDto {
  string source = 1;
  string flow = 2;
  string dimension = 3; /* dimension id (as returned by ListDimensions), zero-based dimension index, or empty for the first wildcard dimension of the key */
  string key = 4;
  optional string database = 5;
  optional string languages = 6;
}

message WebStatusesRequestDto {
  repeated string sources = 1; /* empty, or a single "all" entry (case-insensitive), means every known source */
}

message ScriptOptionsDto {
  optional string target = 1; /* <language>/<transport>, e.g. "python/cli"; absent = "python/cli" */
  repeated string cli_launcher = 2; /* command used to launch the CLI, e.g. ["java", "-jar", "sdmx-dl-cli-bin.jar"]; empty = ["sdmx-dl"] */
  optional string rest_endpoint = 3; /* base URI of the REST API; absent = default endpoint */
  optional string output_file = 4; /* file written by the script; absent = standard output */
  map<string, string> properties = 5; /* generator-specific properties, as listed by ListScriptTargets */
}

message WebDataScriptRequestDto {
  WebDataRequestDto request = 1;
  ScriptOptionsDto options = 2;
}

message WebFlowsScriptRequestDto {
  WebFlowsRequestDto request = 1;
  ScriptOptionsDto options = 2;
}

message ScriptTargetDto {
  string target = 1; /* <language>/<transport> */
  string language = 2;
  string transport = 3;
  repeated string commands = 4; /* supported request types, e.g. "data", "flows" */
  repeated string properties = 5; /* names of the generator-specific properties */
}

message ScriptDto {
  string target = 1;
  string file_extension = 2;
  string content = 3;
  repeated string warnings = 4; /* request parameters that the target cannot honor */
  string media_type = 5; /* e.g. "text/x-python" */
}