# gRPC config (served by the HTTP server, see quarkus.http.port)
quarkus.grpc.server.use-separate-server=false
quarkus.generate-code.grpc.scan-for-imports=com.github.nbbrd.sdmx-dl:sdmx-dl-format-protobuf
quarkus.grpc.server.enable-reflection-service=true

# HTTP config (gRPC, REST, MCP and OpenAPI)
quarkus.http.host=127.0.0.1
%dev.quarkus.http.port=4558
%prod.quarkus.http.port=4559
#%prod.quarkus.http.host-enabled=false
quarkus.swagger-ui.always-include=true
mp.openapi.scan.exclude.packages=com.google.protobuf
quarkus.smallrye-openapi.store-schema-directory=target/generated/openapi

# Native config
quarkus.native.auto-service-loader-registration=true
quarkus.native.resources.includes=**/*.xml,**/*.ps1,**/*.json,**/*.csv

# CORS config
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/http://localhost:.*/,/http://127\.0\.0\.1:.*/,null
#quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H
