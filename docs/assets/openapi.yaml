---
openapi: 3.1.0
tags:
- name: sdmx-dl v1
  description: sdmx-dl REST API version 1 (deprecated)
- name: sdmx-dl v2
  description: sdmx-dl REST API version 2
components:
  schemas:
    AboutDto:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
    AccessReportDto:
      type: object
      properties:
        reachable:
          type: boolean
        accessible:
          type: boolean
        uri:
          type: string
        duration:
          type: integer
          format: int64
        statusCode:
          type: integer
          format: int32
        errorMessage:
          type: string
    AttributeDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        codelist:
          $ref: "#/components/schemas/CodelistDto"
        relationship:
          $ref: "#/components/schemas/AttributeRelationshipDto"
    AttributeRelationshipDto:
      type: string
      enum:
      - UNKNOWN
      - DATAFLOW
      - GROUP
      - SERIES
      - OBSERVATION
      - UNRECOGNIZED
    AvailabilityDto:
      type: object
      properties:
        dimension:
          type: string
        codes:
          type: object
          additionalProperties:
            type: string
        codeCount:
          type: integer
          format: int32
    CodelistDto:
      type: object
      properties:
        ref:
          type: string
        codes:
          type: object
          additionalProperties:
            type: string
        codeCount:
          type: integer
          format: int32
    ConfidentialityDto:
      type: string
      enum:
      - PUBLIC
      - UNRESTRICTED
      - RESTRICTED
      - CONFIDENTIAL
      - SECRET
      - UNRECOGNIZED
    DataSetDto:
      type: object
      properties:
        ref:
          type: string
        query:
          $ref: "#/components/schemas/QueryDto"
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDto"
    DatabaseDto:
      type: object
      properties:
        ref:
          type: string
        name:
          type: string
    DatabaseRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        database:
          type: string
        languages:
          type: string
    Detail:
      type: string
      enum:
      - FULL
      - DATA_ONLY
      - SERIES_KEYS_ONLY
      - NO_DATA
    DetailDto:
      type: string
      enum:
      - FULL
      - DATA_ONLY
      - SERIES_KEYS_ONLY
      - NO_DATA
      - UNRECOGNIZED
    DimensionCodesDto:
      type: object
      properties:
        descriptorForType:
          type: object
        codes:
          type: array
    DimensionDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        codelist:
          $ref: "#/components/schemas/CodelistDto"
        index:
          type: integer
          format: int32
    EmptyDto:
      type: object
      properties:
        descriptorForType:
          type: object
    FlowDto:
      type: object
      properties:
        ref:
          type: string
        structureRef:
          type: string
        name:
          type: string
        description:
          type: string
    FlowRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        flow:
          type: string
        database:
          type: string
        languages:
          type: string
    HealthReportDto:
      type: object
      properties:
        source:
          type: string
        verdict:
          $ref: "#/components/schemas/Verdict"
        monitor:
          $ref: "#/components/schemas/MonitorReportDto"
        monitorError:
          type: string
        access:
          $ref: "#/components/schemas/AccessReportDto"
    KeyDimensionRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        flow:
          type: string
        key:
          type: string
        dimension:
          type: integer
          format: int32
        database:
          type: string
        languages:
          type: string
    KeyRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        flow:
          type: string
        key:
          type: string
        database:
          type: string
        languages:
          type: string
        startPeriod:
          type: string
        endPeriod:
          type: string
        firstNObservations:
          type: integer
          format: int32
        lastNObservations:
          type: integer
          format: int32
    MetaSetDto:
      type: object
      properties:
        flow:
          $ref: "#/components/schemas/FlowDto"
        structure:
          $ref: "#/components/schemas/StructureDto"
    MonitorReportDto:
      type: object
      properties:
        source:
          type: string
        status:
          $ref: "#/components/schemas/MonitorStatusDto"
        uptimeRatio:
          type: number
          format: double
        averageResponseTime:
          type: integer
          format: int64
    MonitorStatusDto:
      type: string
      enum:
      - UNKNOWN
      - UP
      - DOWN
      - UNRECOGNIZED
    ObsDto:
      type: object
      properties:
        period:
          type: string
        value:
          type: number
          format: double
        meta:
          type: object
          additionalProperties:
            type: string
    QueryDto:
      type: object
      properties:
        key:
          type: string
        detail:
          $ref: "#/components/schemas/DetailDto"
        startPeriod:
          type: string
        endPeriod:
          type: string
        firstNObservations:
          type: integer
          format: int32
        lastNObservations:
          type: integer
          format: int32
    ScriptDto:
      type: object
      properties:
        descriptorForType:
          type: object
        target:
          type: string
        fileExtension:
          type: string
        content:
          type: string
        mediaType:
          type: string
        warnings:
          type: array
    ScriptFormat:
      type: string
      enum:
      - JSON
      - RAW
    ScriptTargetDto:
      type: object
      properties:
        descriptorForType:
          type: object
        target:
          type: string
        language:
          type: string
        transport:
          type: string
        commands:
          type: array
        properties:
          type: array
    SearchDatabaseRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        query:
          type: string
        languages:
          type: string
        maxResults:
          type: integer
          format: int32
    SearchFlowsRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        query:
          type: string
        database:
          type: string
        languages:
          type: string
        maxResults:
          type: integer
          format: int32
    SearchSourcesRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        query:
          type: string
        languages:
          type: string
        maxResults:
          type: integer
          format: int32
    SeriesDto:
      type: object
      properties:
        key:
          type: string
        meta:
          type: object
          additionalProperties:
            type: string
        obs:
          type: array
          items:
            $ref: "#/components/schemas/ObsDto"
    SourceRequestDto:
      type: object
      properties:
        descriptorForType:
          type: object
        source:
          type: string
        languages:
          type: string
    StructureDto:
      type: object
      properties:
        ref:
          type: string
        timeDimensionId:
          type: string
        primaryMeasureId:
          type: string
        name:
          type: string
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/DimensionDto"
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AttributeDto"
    Verdict:
      type: string
      enum:
      - UNKNOWN
      - OK
      - DEGRADED
      - LOCAL_ISSUE
      - REMOTE_OUTAGE
      - UNREACHABLE
      - UNRECOGNIZED
    WebSourceDto:
      type: object
      properties:
        id:
          type: string
        names:
          type: object
          additionalProperties:
            type: string
        driver:
          type: string
        endpoint:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        website:
          type: string
        monitor:
          type: string
        monitorWebsite:
          type: string
        confidentiality:
          $ref: "#/components/schemas/ConfidentialityDto"
        aliases:
          type: array
paths:
  /sdmx-dl/about:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutDto"
        "400":
          description: Bad Request
      summary: Get About
  /sdmx-dl/availability:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
                  flow: EXR
                  key: M..EUR.SP00.A
                  dimension: 1
            schema:
              $ref: "#/components/schemas/KeyDimensionRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DimensionCodesDto"
        "400":
          description: Bad Request
      summary: Get Availability
  /sdmx-dl/data:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
                  flow: EXR
                  key: M.USD+CHF.EUR.SP00.A
            schema:
              $ref: "#/components/schemas/KeyRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSetDto"
        "400":
          description: Bad Request
      summary: Get Data
  /sdmx-dl/dataStream:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
                  flow: EXR
                  key: M.USD+CHF.EUR.SP00.A
            schema:
              $ref: "#/components/schemas/KeyRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeriesDto"
        "400":
          description: Bad Request
      summary: Get Data Stream
  /sdmx-dl/databases:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
            schema:
              $ref: "#/components/schemas/SourceRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseDto"
        "400":
          description: Bad Request
      summary: Get Databases
  /sdmx-dl/flows:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
            schema:
              $ref: "#/components/schemas/DatabaseRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowDto"
        "400":
          description: Bad Request
      summary: Get Flows
  /sdmx-dl/meta:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
                  flow: EXR
            schema:
              $ref: "#/components/schemas/FlowRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaSetDto"
        "400":
          description: Bad Request
      summary: Get Meta
  /sdmx-dl/monitorReport:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
            schema:
              $ref: "#/components/schemas/SourceRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorReportDto"
        "400":
          description: Bad Request
      summary: Get Monitor Report
  /sdmx-dl/searchDatabases:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchDatabaseRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseDto"
        "400":
          description: Bad Request
      summary: Search Databases
  /sdmx-dl/searchFlows:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  source: ECB
                  query: exchange rates
                  maxResults: 5
            schema:
              $ref: "#/components/schemas/SearchFlowsRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowDto"
        "400":
          description: Bad Request
      summary: Search Flows
  /sdmx-dl/searchSources:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            examples:
              ECB example:
                value:
                  query: european central
                  maxResults: 5
            schema:
              $ref: "#/components/schemas/SearchSourcesRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebSourceDto"
        "400":
          description: Bad Request
      summary: Search Sources
  /sdmx-dl/sources:
    post:
      deprecated: true
      tags:
      - sdmx-dl v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebSourceDto"
        "400":
          description: Bad Request
      summary: Get Sources
  /sdmx-dl/v2/about:
    get:
      tags:
      - sdmx-dl v2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AboutDto"
      summary: Get About
  /sdmx-dl/v2/health:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - description: "Comma-separated checks: 'monitor' (third-party monitor, default)\
          \ and/or 'access' (live request against the source)"
        name: checks
        in: query
        schema:
          type: string
          default: monitor
      - name: sources
        in: query
        schema:
          type: string
          default: all
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HealthReportDto"
      summary: Check Health
  /sdmx-dl/v2/script/targets:
    get:
      tags:
      - sdmx-dl v2
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScriptTargetDto"
      summary: List Script Targets
  /sdmx-dl/v2/sources:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxConfidentiality
        in: query
        schema:
          type: string
          default: SECRET
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: query
        in: query
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebSourceDto"
      summary: List Sources
  /sdmx-dl/v2/{source}/databases:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: query
        in: query
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatabaseDto"
      summary: List Databases
  /sdmx-dl/v2/{source}/flows:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: database
        in: query
        schema:
          type: string
          default: ""
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: plainText
        in: query
        schema:
          type: boolean
          default: false
      - name: query
        in: query
        schema:
          type: string
          default: ""
      - name: truncate
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowDto"
      summary: List Flows
  /sdmx-dl/v2/{source}/flows:script:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: cliLauncher
        in: query
        schema:
          type: array
          items:
            type: string
      - name: database
        in: query
        schema:
          type: string
          default: ""
      - name: format
        in: query
        schema:
          $ref: "#/components/schemas/ScriptFormat"
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: outputFile
        in: query
        schema:
          type: string
      - name: plainText
        in: query
        schema:
          type: boolean
          default: false
      - name: property
        in: query
        schema:
          type: array
          items:
            type: string
      - name: query
        in: query
        schema:
          type: string
          default: ""
      - name: restEndpoint
        in: query
        schema:
          type: string
      - name: target
        in: query
        schema:
          type: string
          default: python/cli
      - name: truncate
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: "The generated script, as a JSON object by default or as a\
            \ downloadable file if format=raw or if the Accept header prefers text/plain\
            \ or application/octet-stream"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScriptDto"
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
      summary: Generate Flows Script
  /sdmx-dl/v2/{source}/health:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: source
        in: path
        required: true
        schema:
          type: string
      - description: "Comma-separated checks: 'monitor' (third-party monitor, default)\
          \ and/or 'access' (live request against the source)"
        name: checks
        in: query
        schema:
          type: string
          default: monitor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReportDto"
      summary: Check Source Health
  /sdmx-dl/v2/{source}/{flow}/attributes:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: flow
        in: path
        required: true
        schema:
          type: string
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: database
        in: query
        schema:
          type: string
          default: ""
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: query
        in: query
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttributeDto"
      summary: List Attributes
  /sdmx-dl/v2/{source}/{flow}/availability:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: flow
        in: path
        required: true
        schema:
          type: string
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: database
        in: query
        schema:
          type: string
          default: ""
      - name: dimension
        in: query
        schema:
          type: string
          default: ""
      - name: key
        in: query
        schema:
          type: string
          default: all
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityDto"
      summary: Get Availability
  /sdmx-dl/v2/{source}/{flow}/codes/{concept}:
    get:
      tags:
      - sdmx-dl v2
      parameters:
      - name: concept
        in: path
        required: true
        schema:
          type: string
      - name: flow
        in: path
        required: true
        schema:
          type: string
      - name: source
        in: path
        required: true
        schema:
          type: string
      - name: database
        in: query
        schema:
          type: string
          default: ""
      - name: languages
        in: query
        schema:
          type: string
          default: '*'
      - name: maxResults
        in: query
        schema:
          type: integer
          format: int32
          default: -1
      - name: query
        in: query
        schema:
          type: string
          default: ""
      responses:
        "200":
          description: OK
          content:
            application/json:
