# Single source of truth for feature availability across flavors (API/CLI/WS).
#
# Used by:
# - content/features/_index.md (via the `feature-matrix` shortcode) to render the capability matrix
# - each content/features/*.md page (via the `feature-status` shortcode) to render its availability badge
#
# Status values: full | partial | none
# `*_note` fields are only shown when the matching status is not "full".
#
# `group` mirrors the "How it works" sections in content/features/_index.md (find | shape | fetch | cross-cutting).
# It is documentation-only for now (not yet consumed by a shortcode) - keep it in sync if you move a feature.
#
# Keep this file in sync with reality whenever a flavor gains/loses a capability;
# it is the only place availability should be stated - do not repeat it as free text elsewhere.

- id: discover-sources
  title: "Discover sources"
  group: find
  api: full
  cli: full
  ws: full

- id: search-sources
  title: "Search sources"
  group: find
  api: full
  cli: full
  ws: full

