baseURL = "http://nbbrd.github.io/sdmx-dl/develop"
title = "sdmx-dl"
theme = "hugo-geekdoc"

pluralizeListTitles = false

# Geekdoc required configuration
pygmentsUseClasses = true
pygmentsCodeFences = true
disablePathToLower = true
enableGitInfo = true

# Required if you want to render robots.txt template
enableRobotsTXT = true

# Needed for mermaid shortcodes
[markup]
  [markup.goldmark.renderer]
    # Needed for mermaid shortcode
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

[taxonomies]
  tag = "tags"

[params]
#  geekdocLogo = "SDMX_logo.svg"
  # Single source of truth for the version used in `//DEPS` JBang headers across the docs.
  # Bump this at release time instead of editing every code sample.
  # Used by the `sdmx-dl-version` shortcode.
  sdmxDlVersion = "3.2.0"
